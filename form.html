<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Launch Party RSVP</title>
</head>
<body>

    <h1>VIP Launch Party RSVP</h1>

    <form>
        
 
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName"><br><br>

        
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"><br><br>

        
        <p>Will you be attending?</p>
        
        <label for="attendingYes">Yes</label>
        <input type="radio" id="attendingYes" name="attending" value="yes">
        
        <label for="attendingNo">No</label>
        <input type="radio" id="attendingNo" name="attending" value="no"><br><br>

        <input type="submit" id="submitBtn" value="Send RSVP">

    </form>

</body>
</html>
